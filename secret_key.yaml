name: CI/CD Pipeline (Windows)

on:
  push:
    branches:
      - Openrouter1  # 👈 replace with your branch name if different
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: windows-latest   # 👈 using Windows runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      - name: Run tests
        run: |
          if (Test-Path "tests") { pytest } else { Write-Output "No tests found" }

      - name: Use secret key
        run: |
          Write-Output "Secret key is available in the environment (but hidden in logs)."
          Write-Output "SECRET_KEY starts with: $(${env:SECRET_KEY}.Substring(0,4))****"
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
